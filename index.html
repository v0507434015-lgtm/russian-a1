<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Russian A1 Exam Trainer</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:linear-gradient(135deg,#4facfe,#00f2fe);

min-height:100vh;

color:white;

overflow-x:hidden;

}

header{

padding:40px;

text-align:center;

}

header h1{

font-size:48px;

margin-bottom:15px;

}

header p{

font-size:22px;

opacity:.9;

}

.container{

width:90%;

max-width:1200px;

margin:auto;

}

.menu{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

margin-top:40px;

}

.card{

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

border-radius:25px;

padding:35px;

cursor:pointer;

transition:.35s;

box-shadow:0 15px 30px rgba(0,0,0,.2);

}

.card:hover{

transform:translateY(-10px) scale(1.03);

background:rgba(255,255,255,.25);

}

.card h2{

font-size:30px;

margin-bottom:15px;

}

.card p{

font-size:18px;

line-height:1.5;

}

section{

display:none;

margin-top:40px;

background:white;

color:#333;

padding:40px;

border-radius:25px;

box-shadow:0 15px 35px rgba(0,0,0,.25);

animation:fade .4s;

}

.active{

display:block;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

button{

background:#4facfe;

color:white;

border:none;

padding:15px 25px;

border-radius:12px;

font-size:18px;

cursor:pointer;

transition:.3s;

margin-top:20px;

}

button:hover{

background:#007bff;

}

.question{

background:#eef7ff;

padding:20px;

border-radius:15px;

margin:20px 0;

}

.answer{

display:none;

margin-top:15px;

padding:15px;

background:#d9f6dd;

border-radius:12px;

}

.flashcards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:20px;

margin-top:30px;

}

.flashcard{

height:130px;

perspective:1000px;

cursor:pointer;

}

.flash-inner{

position:relative;

width:100%;

height:100%;

transition:.7s;

transform-style:preserve-3d;

}

.flashcard:hover .flash-inner{

transform:rotateY(180deg);

}

.front,
.back{

position:absolute;

width:100%;

height:100%;

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

text-align:center;

font-weight:bold;

backface-visibility:hidden;

}

.front{

background:#4facfe;

color:white;

}

.back{

background:#43e97b;

color:#222;

transform:rotateY(180deg);

}

.randomQuestion{

font-size:28px;

margin-top:25px;

font-weight:bold;

text-align:center;

}

footer{

margin:70px 0 30px;

text-align:center;

opacity:.8;

font-size:15px;

}

</style>

</head>

<body>

<header>

<h1>🇷🇺 Russian A1 Exam Trainer</h1>

<p>Интерактивная подготовка к экзамену</p>

</header>
